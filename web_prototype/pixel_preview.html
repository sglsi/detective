<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素风格转换预览 - 维多利亚街道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #d4a574;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls button {
            background: #d4a574;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .controls button:hover {
            background: #e8c9a0;
            transform: translateY(-2px);
        }
        .controls button.active {
            background: #fff;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
        }
        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .image-card {
            background: #2a2a3e;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .image-card:hover {
            border-color: #d4a574;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .image-card h3 {
            background: #3a3a4e;
            padding: 12px;
            color: #d4a574;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .image-card h3 span {
            color: #888;
            font-size: 12px;
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        .info-panel {
            background: #2a2a3e;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .info-panel h2 {
            color: #d4a574;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .info-item {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 5px;
        }
        .info-item label {
            color: #888;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }
        .info-item value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .comparison-slider {
            position: relative;
            max-width: 800px;
            margin: 30px auto;
            border: 3px solid #d4a574;
            border-radius: 10px;
            overflow: hidden;
        }
        .comparison-slider img {
            width: 100%;
            display: block;
        }
        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #d4a574;
            cursor: ew-resize;
            left: 50%;
        }
        .slider-label {
            position: absolute;
            top: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        .slider-label.left {
            left: 10px;
        }
        .slider-label.right {
            right: 10px;
        }
    </style>
</head>
<body>
    <h1> 像素风格转换预览</h1>
    <p class="subtitle">维多利亚街道场景 - 不同像素化效果对比</p>
    
    <div class="controls">
        <button onclick="showVersion('original')" class="active" id="btn-original">原图</button>
        <button onclick="showVersion('4px')" id="btn-4px">4px 像素</button>
        <button onclick="showVersion('8px')" id="btn-8px">8px 像素</button>
        <button onclick="showVersion('16px')" id="btn-16px">16px 像素</button>
        <button onclick="showVersion('32px')" id="btn-32px">32px 像素</button>
        <button onclick="showVersion('16color')" id="btn-16color">16 色</button>
        <button onclick="showVersion('8color')" id="btn-8color">8 色</button>
    </div>

    <div class="preview-container">
        <div class="image-grid">
            <div class="image-card">
                <h3>原图 <span>1920×1080</span></h3>
                <img src="victorian_street.png" alt="原图" id="img-original">
            </div>
            <div class="image-card">
                <h3>4px 像素化 <span>246 KB</span></h3>
                <img src="./pixel_4px.png" alt="4px 像素化" id="img-4px">
            </div>
            <div class="image-card">
                <h3>8px 像素化 <span>94 KB</span></h3>
                <img src="./pixel_8px.png" alt="8px 像素化" id="img-8px">
            </div>
            <div class="image-card">
                <h3>16px 像素化 <span>36 KB</span></h3>
                <img src="./pixel_16px.png" alt="16px 像素化" id="img-16px">
            </div>
            <div class="image-card">
                <h3>32px 像素化 <span>17 KB</span></h3>
                <img src="./pixel_32px.png" alt="32px 像素化" id="img-32px">
            </div>
            <div class="image-card">
                <h3>16 色调色板 <span>387 KB</span></h3>
                <img src="./pixel_16color.png" alt="16 色" id="img-16color">
            </div>
            <div class="image-card">
                <h3>8 色调色板 <span>237 KB</span></h3>
                <img src="./pixel_8color.png" alt="8 色" id="img-8color">
            </div>
        </div>

        <div class="info-panel">
            <h2>📊 转换参数说明</h2>
            <div class="info-grid">
                <div class="info-item">
                    <label>像素大小</label>
                    <value>4-32 px</value>
                </div>
                <div class="info-item">
                    <label>调色板颜色</label>
                    <value>8-16 色</value>
                </div>
                <div class="info-item">
                    <label>渲染方式</label>
                    <value>NEAREST (硬边缘)</value>
                </div>
                <div class="info-item">
                    <label>适用场景</label>
                    <value>复古像素游戏</value>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showVersion(version) {
            // 更新按钮状态
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn-' + version).classList.add('active');
            
            // 滚动到对应图片
            const img = document.getElementById('img-' + version);
            if (img) {
                img.scrollIntoView({ behavior: 'smooth', block: 'center' });
                img.parentElement.style.borderColor = '#d4a574';
                setTimeout(() => {
                    img.parentElement.style.borderColor = '#444';
                }, 2000);
            }
        }
    </script>
</body>
</html>
