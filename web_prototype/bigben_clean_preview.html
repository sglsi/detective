<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大本钟像素艺术 - 透明底版本对比</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #d4af37;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 1.1em;
            margin-bottom: 40px;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .preview-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 15px;
            padding: 25px;
        }
        .preview-title {
            color: #d4af37;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-align: center;
        }
        .image-container {
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            overflow: hidden;
        }
        .image-container img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 8px;
        }
        .specs {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 0.9em;
        }
        .specs span { color: #d4af37; }
        .select-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .select-btn:hover {
            transform: scale(1.02);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #d4af37;
            text-decoration: none;
            font-size: 1.1em;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>大本钟像素艺术 - 透明底版本</h1>
        <p class="subtitle">重新生成，绿幕抠图，只保留大本钟主体</p>

        <div class="preview-grid">
            <!-- 方案 1 -->
            <div class="preview-card">
                <h3 class="preview-title">方案 1</h3>
                <div class="image-container">
                    <img src="bigben_pixel_clean_1.png" alt="大本钟方案 1 - 透明底">
                </div>
                <div class="specs">
                    <span>文件：</span>bigben_pixel_clean_1.png | 
                    <span>尺寸：</span>2048×2048 RGBA | 
                    <span>抠图：</span>绿幕精确抠图
                </div>
                <button class="select-btn" onclick="selectVersion(1)">选择方案 1</button>
            </div>

            <!-- 方案 2 -->
            <div class="preview-card">
                <h3 class="preview-title">方案 2</h3>
                <div class="image-container">
                    <img src="bigben_pixel_clean_2.png" alt="大本钟方案 2 - 透明底">
                </div>
                <div class="specs">
                    <span>文件：</span>bigben_pixel_clean_2.png | 
                    <span>尺寸：</span>2048×2048 RGBA | 
                    <span>抠图：</span>绿幕精确抠图
                </div>
                <button class="select-btn" onclick="selectVersion(2)">选择方案 2</button>
            </div>
        </div>

        <a href="bigben_godot_preview.html" class="back-link">← 返回 Godot 集成预览</a>
    </div>

    <script>
        function selectVersion(num) {
            alert('已选择方案 ' + num + '！\n\n将更新 Godot 项目中的大本钟资源为：bigben_pixel_clean_' + num + '.png');
        }
    </script>
</body>
</html>
