<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大本钟资源预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            flex-direction: column;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .info {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preview-box {
            text-align: center;
        }

        .preview-box h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .image-wrapper {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            display: inline-block;
        }

        .image-wrapper.dark {
            background: #0a0a0a;
        }

        .image-wrapper.night {
            background: linear-gradient(to bottom, #0a0a2a 0%, #1a1a3a 100%);
        }

        .image-wrapper.checker {
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #1a1a1a;
        }

        .image-wrapper.london-bg {
            background: url('bg_london_1920x1080.jpg') center/cover;
            background-size: 400px 225px;
            background-position: center;
        }

        img {
            max-width: 400px;
            max-height: 300px;
            display: block;
        }

        .specs {
            margin-top: 15px;
            color: #888;
            font-size: 12px;
        }

        .back-link {
            margin-top: 40px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .scale-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .scale-controls button {
            background: #333;
            color: #d4af37;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .scale-controls button:hover {
            background: #444;
        }

        .scale-controls button.active {
            background: #d4af37;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <h1> 大本钟资源预览</h1>
    <p class="info">从原图切出的大本钟局部 | 维多利亚时代议会大厦</p>
    
    <div class="container">
        <div class="preview-box">
            <h3>原始版本（RGB）</h3>
            <div class="image-wrapper">
                <img src="bigben_visible.png" alt="大本钟原始版本" id="bigben-original">
            </div>
            <p class="specs">280×150 RGB</p>
        </div>

        <div class="preview-box">
            <h3>透明背景效果</h3>
            <div class="image-wrapper checker">
                <img src="bigben_visible.png" alt="大本钟透明背景" id="bigben-checker">
            </div>
            <p class="specs">棋盘格背景</p>
        </div>

        <div class="preview-box">
            <h3>伦敦背景融合效果</h3>
            <div class="image-wrapper london-bg">
                <img src="bigben_visible.png" alt="大本钟背景融合" id="bigben-london" style="opacity: 0.9;">
            </div>
            <p class="specs">与原背景融合</p>
        </div>
    </div>

    <div class="scale-controls">
        <button onclick="setScale(1)" class="active">1x 原始尺寸</button>
        <button onclick="setScale(2)">2x 放大</button>
        <button onclick="setScale(3)">3x 放大</button>
        <button onclick="setScale(4)">4x 放大</button>
    </div>

    <a href="london_bg_preview.html" class="back-link">← 返回伦敦背景预览</a>

    <script>
        function setScale(scale) {
            const images = document.querySelectorAll('.preview-box img');
            images.forEach(img => {
                img.style.transform = `scale(${scale})`;
                img.style.transformOrigin = 'center';
            });
            
            // 更新按钮状态
            document.querySelectorAll('.scale-controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
