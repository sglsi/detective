<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>福尔摩斯表情预览</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #1a1a2e;
            color: white;
            font-family: 'Courier New', monospace;
        }
        h1 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .card {
            background: #16213e;
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            min-width: 200px;
        }
        .card h2 {
            color: #d4af37;
            margin: 10px 0;
        }
        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 256px;
            height: 256px;
            background: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 16px 16px;
            border: 1px solid #444;
        }
        .info {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
        }
        .changes {
            background: #0f3460;
            border-radius: 4px;
            padding: 15px;
            margin-top: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .changes h3 {
            color: #d4af37;
            margin-top: 0;
        }
        .changes ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .changes li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 福尔摩斯表情预览（修改后）</h1>
    
    <div class="container">
        <div class="card">
            <img src="/assets/portraits/pixel/sherlock_兴奋.png" class="pixel-art" alt="兴奋">
            <h2>兴奋</h2>
            <div class="info">眼睛缩小，更开心</div>
        </div>
        
        <div class="card">
            <img src="/assets/portraits/pixel/sherlock_喜悦.png" class="pixel-art" alt="喜悦">
            <h2>喜悦</h2>
            <div class="info">中年人，无文字</div>
        </div>
        
        <div class="card">
            <img src="/assets/portraits/pixel/sherlock_愤怒.png" class="pixel-art" alt="愤怒">
            <h2>愤怒</h2>
            <div class="info">减少 60% 愤怒值</div>
        </div>
    </div>
    
    <div class="changes">
        <h3>修改内容</h3>
        <ul>
            <li><strong>兴奋</strong>：眼睛从过大改为正常大小，表情更开心自然</li>
            <li><strong>喜悦</strong>：从老头改为中年人（30-40 岁），移除英文字母，纯表情呈现</li>
            <li><strong>愤怒</strong>：愤怒程度降低 60%，从暴怒改为轻微不满/皱眉</li>
        </ul>
    </div>
</body>
</html>
