<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>维多利亚建筑外观预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #1a1a1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 10px;
    color: #f0e6d2;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
  }
  .image-container {
    max-width: 1200px;
    width: 100%;
    background: #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .image-container img {
    width: 100%;
    height: auto;
    display: block;
  }
  .info-panel {
    max-width: 1200px;
    width: 100%;
    margin-top: 20px;
    padding: 20px;
    background: #2a2a2a;
    border-radius: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .info-item {
    flex: 1;
    min-width: 150px;
  }
  .info-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .info-value {
    font-size: 18px;
    color: #f0e6d2;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>维多利亚建筑外观</h1>
  <p class="subtitle">Victorian Building Exterior - 场景背景资源</p>
  
  <div class="image-container">
    <img src="victorian_building_exterior.jpg" alt="维多利亚建筑外观">
  </div>
  
  <div class="info-panel">
    <div class="info-item">
      <div class="info-label">尺寸</div>
      <div class="info-value">1920×1080</div>
    </div>
    <div class="info-item">
      <div class="info-label">格式</div>
      <div class="info-value">JPG</div>
    </div>
    <div class="info-item">
      <div class="info-label">质量</div>
      <div class="info-value">75</div>
    </div>
    <div class="info-item">
      <div class="info-label">文件大小</div>
      <div class="info-value">253 KB</div>
    </div>
  </div>
</body>
</html>
