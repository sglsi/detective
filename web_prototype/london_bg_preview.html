<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伦敦背景绘制 - Godot 效果预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .info {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 12px;
            z-index: 10;
        }

        .scene-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            border: 2px solid #333;
            transform-origin: top center;
        }

        /* 天空渐变层 */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                #5a6b8c 0%, 
                #7a8ba8 30%, 
                #b8b0a0 60%, 
                #d4c8b0 100%);
            z-index: 1;
        }

        /* 背景图层 */
        .background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.15);
            width: 1920px;
            height: 1080px;
            object-fit: cover;
            z-index: 2;
        }

        /* 雾气/大气层 */
        .atmosphere {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* 暗角效果 */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                transparent 0%, 
                transparent 40%, 
                rgba(0, 0, 0, 0.4) 70%, 
                rgba(0, 0, 0, 0.8) 100%);
            z-index: 4;
            pointer-events: none;
        }

        /* 雾气效果 */
        .fog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 50%, rgba(100, 110, 130, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(80, 90, 110, 0.2) 0%, transparent 40%);
            animation: fogDrift 20s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes fogDrift {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(30px); opacity: 0.8; }
        }

        /* 煤气灯辉光 */
        .gas-lamp {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 184, 89, 0.6) 0%, 
                rgba(255, 184, 89, 0.3) 30%, 
                rgba(255, 184, 89, 0.1) 60%, 
                transparent 100%);
            animation: flicker 3s ease-in-out infinite;
            z-index: 6;
            pointer-events: none;
        }

        .lamp-1 {
            left: 508px;  /* 0.265 * 1920 */
            top: 453px;   /* 0.42 * 1080 */
            width: 180px;
            height: 180px;
        }

        .lamp-2 {
            left: 1497px; /* 0.78 * 1920 */
            top: 561px;   /* 0.52 * 1080 */
            width: 180px;
            height: 180px;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            25% { opacity: 1; transform: scale(1.05); }
            50% { opacity: 0.85; transform: scale(0.98); }
            75% { opacity: 0.95; transform: scale(1.02); }
        }

        /* 控制面板 */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .controls label {
            color: #d4af37;
            font-size: 12px;
        }

        .controls select, .controls button {
            background: #2a2a2a;
            color: #d4af37;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .controls button:hover {
            background: #3a3a3a;
        }

        .controls input[type="checkbox"] {
            accent-color: #d4af37;
        }

        .specs {
            margin-top: 15px;
            color: #666;
            font-size: 11px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1> 伦敦背景绘制 - Godot 4.7 效果预览</h1>
    <p class="info">模拟 main.tscn 场景：背景 + 天空渐变 + 雾气 + 暗角 + 煤气灯辉光</p>
    
    <div class="scene-container" id="scene">
        <!-- 天空渐变层 -->
        <div class="sky" id="sky"></div>
        
        <!-- 背景图层 -->
        <img class="background" src="bg_london_1920x1080.jpg" alt="伦敦背景" id="background">
        
        <!-- 大气层 -->
        <div class="atmosphere">
            <div class="fog" id="fog"></div>
            <div class="vignette" id="vignette"></div>
        </div>
        
        <!-- 煤气灯辉光 -->
        <div class="gas-lamp lamp-1" id="lamp1"></div>
        <div class="gas-lamp lamp-2" id="lamp2"></div>
        
        <!-- 大本钟标注已移除 -->
    </div>

    <!-- 控制面板 -->
    <div class="controls">
        <label>氛围预设:</label>
        <select id="preset" onchange="changePreset(this.value)">
            <option value="day">Day (白天)</option>
            <option value="dusk" selected>Dusk (黄昏)</option>
            <option value="night">Night (夜晚)</option>
            <option value="foggy">Foggy (雾天)</option>
        </select>
        
        <label><input type="checkbox" id="autoPan" checked onchange="toggleAutoPan()"> 自动平移</label>
        <label><input type="checkbox" id="showLamps" checked onchange="toggleLamps()"> 煤气灯</label>
    </div>

    <p class="specs">
        背景：1920×1080 | 摄像机缓移：±120px | 煤气灯：程序化闪烁
    </p>

    <script>
        // 自适应缩放
        function scaleScene() {
            const scene = document.getElementById('scene');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scaleX = windowWidth / 1920;
            const scaleY = (windowHeight - 150) / 1080;
            const scale = Math.min(scaleX, scaleY) * 0.95;
            scene.style.transform = `scale(${scale})`;
        }

        scaleScene();
        window.addEventListener('resize', scaleScene);

        // 氛围预设
        const presets = {
            day: {
                sky: 'linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 40%, #F5F5DC 100%)',
                fogColor: 'rgba(200, 210, 220, 0.15)',
                fogDensity: 0.2,
                vignetteStrength: 0.4,
                lampIntensity: 0.0
            },
            dusk: {
                sky: 'linear-gradient(to bottom, #5a6b8c 0%, #7a8ba8 30%, #b8b0a0 60%, #d4c8b0 100%)',
                fogColor: 'rgba(60, 55, 75, 0.35)',
                fogDensity: 0.4,
                vignetteStrength: 0.7,
                lampIntensity: 0.9
            },
            night: {
                sky: 'linear-gradient(to bottom, #1a1a2e 0%, #2a2a3e 40%, #3a3a4e 100%)',
                fogColor: 'rgba(20, 25, 40, 0.6)',
                fogDensity: 0.6,
                vignetteStrength: 0.9,
                lampIntensity: 1.4
            },
            foggy: {
                sky: 'linear-gradient(to bottom, #6a6a70 0%, #8a8a90 40%, #aaaab0 100%)',
                fogColor: 'rgba(100, 100, 110, 0.65)',
                fogDensity: 0.7,
                vignetteStrength: 0.6,
                lampIntensity: 1.1
            }
        };

        function changePreset(preset) {
            const p = presets[preset];
            document.getElementById('sky').style.background = p.sky;
            document.getElementById('fog').style.background = 
                `radial-gradient(ellipse at 30% 50%, ${p.fogColor} 0%, transparent 50%),
                 radial-gradient(ellipse at 70% 60%, ${p.fogColor} 0%, transparent 40%)`;
            document.getElementById('vignette').style.background = 
                `radial-gradient(ellipse at center, transparent 0%, transparent 40%, 
                 rgba(0, 0, 0, ${p.vignetteStrength * 0.5}) 70%, 
                 rgba(0, 0, 0, ${p.vignetteStrength}) 100%)`;
            
            const lamps = document.querySelectorAll('.gas-lamp');
            lamps.forEach(lamp => {
                lamp.style.opacity = p.lampIntensity > 0 ? 0.5 + p.lampIntensity * 0.5 : 0;
            });
        }

        // 自动平移
        let autoPanEnabled = true;
        let panDirection = 1;
        let cameraX = 960;

        function toggleAutoPan() {
            autoPanEnabled = document.getElementById('autoPan').checked;
        }

        function animatePan() {
            if (autoPanEnabled) {
                cameraX += 0.3 * panDirection;
                if (cameraX >= 960 + 120) panDirection = -1;
                if (cameraX <= 960 - 120) panDirection = 1;
                
                const bg = document.getElementById('background');
                const offset = (cameraX - 960) * 0.5;
                bg.style.transform = `translate(calc(-50% + ${offset}px), -50%) scale(1.15)`;
            }
            requestAnimationFrame(animatePan);
        }

        animatePan();

        // 切换煤气灯
        function toggleLamps() {
            const show = document.getElementById('showLamps').checked;
            document.querySelectorAll('.gas-lamp').forEach(lamp => {
                lamp.style.display = show ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
