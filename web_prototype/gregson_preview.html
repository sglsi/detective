<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葛莱森探长 - 角色资源预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 40px;
        }
        
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .resource-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .resource-card h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        
        .resource-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 20px 20px;
            display: block;
        }
        
        .resource-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .resource-info p {
            margin: 5px 0;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        
        .status.success {
            background: #2ecc71;
            color: white;
        }
        
        .note {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .note h3 {
            color: #d4af37;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 葛莱森探长</h1>
        <p class="subtitle">Scotland Yard 侦探 | 像素艺术风格角色资源</p>
        
        <div class="resource-grid">
            <div class="resource-card">
                <h2>角色立绘</h2>
                <img src="gregson_portrait.png" alt="Gregson Portrait">
                <div class="resource-info">
                    <p><strong>文件:</strong> gregson_portrait.png</p>
                    <p><strong>尺寸:</strong> 579×1146</p>
                    <p><strong>格式:</strong> RGBA (透明底)</p>
                    <p><strong>大小:</strong> 1.2 MB</p>
                    <p><strong>状态:</strong> <span class="status success">✓ 新上传</span></p>
                </div>
            </div>
        </div>
        
        <div class="note">
            <h3>📝 更新说明</h3>
            <p>已更新葛莱森探长的角色立绘资源。新图片采用像素艺术风格，透明背景，尺寸 579×1146，可直接用于 Godot 游戏引擎。</p>
            <p><strong>位置:</strong> godot_project/assets/characters/gregson/</p>
        </div>
    </div>
</body>
</html>
