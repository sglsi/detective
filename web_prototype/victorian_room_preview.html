<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维多利亚房间场景背景预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #e0e0e0;
        }
        
        .info {
            text-align: center;
            margin-bottom: 30px;
            color: #888;
            font-size: 14px;
        }
        
        .image-wrapper {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .specs {
            margin-top: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        
        .specs h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #e0e0e0;
        }
        
        .specs ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .specs li {
            padding: 8px 12px;
            background: #333;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .specs li strong {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>维多利亚房间场景背景</h1>
        <div class="info">
            维多利亚时代伦敦侦探办公室 · 场景背景图
        </div>
        
        <div class="image-wrapper">
            <img src="victorian_room.jpg" alt="维多利亚房间场景背景">
        </div>
        
        <div class="specs">
            <h2>文件规格</h2>
            <ul>
                <li><strong>尺寸：</strong>1920 × 1080</li>
                <li><strong>格式：</strong>JPG</li>
                <li><strong>质量：</strong>80</li>
                <li><strong>文件大小：</strong>282 KB</li>
                <li><strong>用途：</strong>游戏场景背景</li>
            </ul>
        </div>
    </div>
</body>
</html>
