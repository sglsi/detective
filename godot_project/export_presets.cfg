body { display: flex; justify-content: center; align-items: center; }
#canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: smooth; touch-action: none; }
</style>
<script>
(function(){
  function __resizeCanvas(){
    var c = document.getElementById('canvas');
    if (!c) return;
    var W = window.innerWidth, H = window.innerHeight;
    var aspect = 1920 / 1080;
    if (W / H > aspect) { c.style.height = H + 'px'; c.style.width = Math.round(H * aspect) + 'px'; }
    else { c.style.width = W + 'px'; c.style.height = Math.round(W / aspect) + 'px'; }
  }
  window.addEventListener('resize', __resizeCanvas);
  if (document.readyState === 'complete') __resizeCanvas();
  else window.addEventListener('load', __resizeCanvas);
  var obs = new MutationObserver(__resizeCanvas);
  obs.observe(document.documentElement, { childList: true, subtree: true });
  setInterval(__resizeCanvas, 500);
})();
</script>
